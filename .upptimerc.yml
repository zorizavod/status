# Публичная страница доступности сервисов Zolotenkov — ZOL-11682.
#
# Проверки выполняет расписание GitHub Actions, страницу отдаёт GitHub Pages.
# Ни то, ни другое не стоит на нашем прод-узле: страница обязана пережить ту
# самую аварию, ради которой её и завели.
owner: zorizavod
repo: status

# Частота рабочих процессов. Ключ штатный для Upptime (helpers/workflows.ts):
# при пересборке файлов .github/workflows значения берутся отсюда, поэтому
# правку расписания надо держать в обоих местах — здесь и в самом workflow.
#
# ZOL-11682. `responseTime` по умолчанию — «0 23 * * *», раз в сутки. Это не
# частота проверок (её задаёт `uptime`), а частота ПРИНУДИТЕЛЬНОЙ записи замера
# в историю: обычный прогон `uptime` коммитит только смену состояния
# («Skipping commit, status is up»), а график времени ответа на странице сервиса
# строится ровно по коммитам history/<slug>.yml (последние 28 штук). При суточной
# записи график вырождался в прямую между двумя точками и выглядел так, будто мы
# опрашиваем сервис раз в сутки. Раз в час — 28 точек примерно за сутки.
workflowSchedule:
  responseTime: "0 * * * *"

sites:
  - name: Рабочее место MRP
    url: https://mrp.zolotenkov.ru/
    slug: mrp
    icon: https://status.zolotenkov.ru/icon-mrp.svg
    maxResponseTime: 3000
  - name: Серверная часть
    url: https://mrp.zolotenkov.ru/api/health
    slug: api
    icon: https://status.zolotenkov.ru/icon-api.svg
    __dangerous__body_down_if_text_missing: '"status":"UP"'
    maxResponseTime: 2000
  - name: База данных
    url: https://mrp.zolotenkov.ru/api/health
    slug: database
    icon: https://status.zolotenkov.ru/icon-database.svg
    __dangerous__body_down_if_text_missing: '"database":"UP"'
    maxResponseTime: 2000
  - name: Сайт
    url: https://zolotenkov.ru/
    slug: website
    icon: https://status.zolotenkov.ru/icon-website.svg
    maxResponseTime: 3000
  - name: Справка
    url: https://support.zolotenkov.ru/
    slug: docs
    icon: https://status.zolotenkov.ru/icon-docs.svg
    maxResponseTime: 3000

status-website:
  cname: status.zolotenkov.ru
  name: Доступность сервисов Zolotenkov
  logoUrl: https://zolotenkov.ru/logo.svg
  favicon: https://zolotenkov.ru/favicon.ico
  theme: light
  introTitle: Доступность сервисов Zolotenkov
  introMessage: >-
    Здесь видно, работают ли прямо сейчас рабочее место MRP, сайт и справка.
    Проверка идёт снаружи, с площадки, не связанной с нашими серверами: даже
    если наш сервер недоступен, эта страница продолжает работать. Проверяем
    несколько раз в час, в отдельные часы реже, поэтому короткий сбой может
    здесь не отразиться. Если у вас что-то не открывается, а здесь всё зелёное — скорее
    всего, дело в вашей сети или у провайдера. Напишите нам на
    svetlana@zolotenkov.ru, разберёмся.
  css: |
    /* ZOL-11727. Фоновая зелёная диагональ карточки — это картинка
       response-time-*.png 600x400, обрезанная по ширине карточки: осей,
       подписей и единиц на ней не видно, графиком она не читается. Убираем её
       на всех ширинах; настоящий график со шкалами открывается по щелчку на
       странице сервиса, где картинка показана целиком. */
    .live-status article.graph {
      background-image: none !important;
    }

    /* ZOL-11727. Эмодзи «галочка» перед строкой «Все сервисы работают» вшит в
       разметку Upptime и настройкой не убирается. Прячем содержимое статьи
       нулевым кеглем и рисуем ту же строку с иконкой circle-check из
       lucide-react — той же, что во всём интерфейсе MRP. Смысл несёт не цвет,
       а форма значка и сам текст (WCAG 1.4.1).
       ВНИМАНИЕ: строка ниже обязана совпадать с i18n.allSystemsOperational. */
    article.up:not(.graph) {
      font-size: 0 !important;
    }
    article.up:not(.graph)::before {
      content: "Все сервисы работают";
      display: inline-flex;
      align-items: center;
      font-size: 1rem;
      line-height: 1.5;
      padding-left: 1.7rem;
      background: url("/icon-check.svg") no-repeat left center;
      background-size: 1.15rem 1.15rem;
    }

    /* ZOL-11722. На телефоне содержимое шапки было втрое шире экрана: заголовок
       обрезался, ссылки «Сайт» и «Справка» были недостижимы. Ниже 640 px шапка
       переносится в две строки, а переключатель периода встаёт под неё.
       Правила идут с !important: они перекрывают собственные стили Svelte,
       у которых специфичность выше за счёт хеш-класса компонента.
       Правило про фоновую диагональ отсюда переехало наверх, в ZOL-11727:
       теперь она убрана на любой ширине. */
    @media (max-width: 640px) {
      nav {
        white-space: normal !important;
        overflow-x: visible !important;
        padding: 0 !important;
      }
      nav .container {
        flex-wrap: wrap !important;
        justify-content: center !important;
        padding: 0 1rem !important;
      }
      nav .logo {
        float: none !important;
        margin-right: 0 !important;
        padding: 0.75rem 0 !important;
      }
      nav .logo img {
        height: 2rem !important;
        margin-right: 0.6rem !important;
      }
      nav .logo div {
        white-space: normal !important;
      }
      nav ul {
        width: 100% !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
      }
      nav ul a {
        padding: 0.6rem 1rem !important;
      }
      .f {
        flex-wrap: wrap !important;
      }
      form.r {
        justify-content: flex-start !important;
        width: 100% !important;
      }
      form.r label {
        margin-left: 0 !important;
        margin-right: 1.1rem !important;
      }
    }

    /* ZOL-11845. Абзацы сообщения об аварии. Отступ задаётся здесь, а не в
       теме: разбивку на абзацы делает наш скрипт ниже (ключ `js`), и класс
       `zol-p` есть только у сделанных им абзацев. Нижний отступ оставлен и у
       последнего абзаца — под ним идёт строка с датой и автором. */
    section article p.zol-p {
      margin: 0 0 0.85rem;
    }

    /* ZOL-11682. Полоса доступности по дням внутри карточки сервиса — то, чего
       у шаблона Upptime нет и что борд просила с самого начала (status.claude.com).
       Разметку рисует наш же скрипт из ключа js ниже, здесь только вид.
       Цвета заданы числами намеренно: переменных нашей дизайн-системы на чужой
       странице нет, а `currentColor` тут ничего не наследует. */
    .zol-days {
      margin-top: 0.9rem;
    }
    .zol-days-bars {
      display: flex;
      gap: 2px;
      height: 34px;
      align-items: stretch;
    }
    .zol-days-bars i {
      display: block;
      flex: 1 1 0;
      min-width: 2px;
      border-radius: 2px;
      background: #cbd5e1;
    }
    .zol-days-bars i.zol-up {
      background: #16a34a;
    }
    .zol-days-bars i.zol-down {
      background: #dc2626;
    }
    .zol-days-legend {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }
    /* На узком экране 30 полосок по 2 px с зазором ещё читаются (390 px даёт
       по ~11 px на день), а вот подписи по краям начинают слипаться. */
    @media (max-width: 380px) {
      .zol-days-legend {
        font-size: 0.72rem;
      }
    }
  js: |
    /* ZOL-11845. Две шероховатости вёрстки страницы аварий, которые видит
       покупатель. Обе рисует шаблон @upptime/status-page, ключами i18n и
       настройками они не меняются:

       1. Дату Upptime печатает как `new Date(...).toLocaleString(i18n.locale)` —
          «24.08.2026, 17:39:52»: с секундами и в часовом поясе браузера, без
          подписи пояса. §8 документа docs/ops/status-page-incident-copy-zol-11731.md
          требует обратного: без секунд и всегда с явным поясом.
       2. Сообщение шаблон прогоняет через snarkdown, а тот схлопывает пустую
          строку в один <br />: четыре абзаца показываются четырьмя строками
          подряд, без просвета. Различить абзац и перенос внутри абзаца в готовой
          разметке нельзя, поэтому чиним на уровне DOM: наши сообщения собираются
          в scripts/incident-copy.mjs через join("\n\n"), одиночных переводов
          строки внутри абзаца в них нет — значит каждый <br /> и есть граница
          абзаца.

       Точка встраивания — ключ status-website.js, штатный для Upptime (рядом с
       уже используемым css). Страница — SPA на Sapper: данные аварии приходят
       после отрисовки, поэтому один проход не годится, нужен MutationObserver.
       Проходы идемпотентны: свой же результат ни один из них не переделывает. */
    (function () {
      "use strict";
      if (typeof window === "undefined" || typeof document === "undefined") return;

      var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля",
                    "августа","сентября","октября","ноября","декабря"];

      /* Так и только так выглядит toLocaleString для локали ru-RU, заданной в
         i18n.locale: от языка браузера она не зависит, шаблон детерминирован.
         В наших текстах такой формы нет — там уже «24 августа, 17:39 (МСК)». */
      var STAMP = /(\d{2})\.(\d{2})\.(\d{4}),\s(\d{2}):(\d{2}):(\d{2})/g;

      var msk = null;
      try {
        msk = new Intl.DateTimeFormat("ru-RU", {
          timeZone: "Europe/Moscow", year: "numeric", month: "numeric",
          day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        });
      } catch (e) { msk = null; }

      function toMoscow(match, d, m, y, hh, mm, ss) {
        if (!msk) return match;
        /* Дата нарисована в поясе браузера. Разбираем её конструктором локального
           времени — получается ровно тот же момент, — и рисуем заново в МСК. */
        var at = new Date(+y, +m - 1, +d, +hh, +mm, +ss);
        if (isNaN(at.getTime())) return match;
        var p = {};
        msk.formatToParts(at).forEach(function (part) { p[part.type] = part.value; });
        var month = MONTHS[+p.month - 1];
        if (!month || !p.day || !p.year || !p.hour || !p.minute) return match;
        /* Год оставляем, в отличие от §8: там подстановка всегда про текущую
           аварию, а здесь та же строка подписывает и запись из архива. */
        return p.day + " " + month + " " + p.year + ", " + p.hour + ":" + p.minute + " (МСК)";
      }

      function retime(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var found = [], node;
        while ((node = walker.nextNode())) {
          STAMP.lastIndex = 0;
          if (node.nodeValue && STAMP.test(node.nodeValue)) found.push(node);
        }
        found.forEach(function (n) {
          STAMP.lastIndex = 0;
          n.nodeValue = n.nodeValue.replace(STAMP, toMoscow);
        });
      }

      function paragraphs(root) {
        var list = root.querySelectorAll("section article p");
        Array.prototype.forEach.call(list, function (p) {
          if (p.className.indexOf("zol-p") !== -1) return;
          if (!p.getElementsByTagName("br").length) return;
          var groups = [[]];
          Array.prototype.slice.call(p.childNodes).forEach(function (n) {
            if (n.nodeType === 1 && n.tagName === "BR") groups.push([]);
            else groups[groups.length - 1].push(n);
          });
          var frag = document.createDocumentFragment();
          groups.forEach(function (group) {
            var text = group.map(function (n) { return n.textContent || ""; }).join("");
            if (!text.trim()) return;
            var box = document.createElement("p");
            box.className = "zol-p";
            group.forEach(function (n) { box.appendChild(n); });
            frag.appendChild(box);
          });
          if (!frag.childNodes.length) return;
          p.parentNode.replaceChild(frag, p);
        });
      }


      /* ZOL-11682. Полоса доступности по дням. Борд сравнила нашу страницу со
         status.claude.com: там у каждого сервиса стоит столбик на день за
         последние 30 дней, и по нему сразу видно, часто ли мы падаем. У шаблона
         @upptime/status-page такого компонента нет, но данные для него Upptime
         уже считает сам: в history/summary.json у каждого сервиса лежит
         `dailyMinutesDown` — сколько минут в этот день сервис был недоступен,
         посчитано по записям об авариях (calculate-uptime.ts, глубина 365 дней).

         Границы суток в этих ключах — по UTC: их формирует dayjs на рабочем узле
         Actions, а он живёт в UTC. Расхождение с московскими сутками — до трёх
         часов, для полосы «день целиком» это несущественно, но помнить стоит.

         Дни до начала наблюдений закрашивать зелёным нельзя: это не «работало»,
         а «мы ещё не смотрели». Дату начала Upptime в summary.json не отдаёт
         (она лежит полем startTime в history/<slug>.yml), поэтому она задана
         здесь числом — все пять проверок завелись в один день. */
      var WATCH_SINCE = "2026-08-23";
      var DAYS = 30;
      var SUMMARY_URL =
        "https://raw.githubusercontent.com/zorizavod/status/master/history/summary.json";

      var summary = null;
      var summaryAsked = false;

      function askSummary() {
        if (summaryAsked || typeof fetch !== "function") return;
        summaryAsked = true;
        fetch(SUMMARY_URL)
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.length) return;
            summary = data;
            schedule();
          })
          .catch(function () { /* полосы просто не будет, страница цела */ });
      }

      function dayKey(at) {
        return at.toISOString().slice(0, 10);
      }

      function dayLabel(key) {
        var parts = key.split("-");
        return parseInt(parts[2], 10) + " " + MONTHS[parseInt(parts[1], 10) - 1];
      }

      function minutesWord(n) {
        var ten = n % 100;
        var one = n % 10;
        if (ten > 10 && ten < 20) return n + " минут";
        if (one === 1) return n + " минуту";
        if (one > 1 && one < 5) return n + " минуты";
        return n + " минут";
      }

      function dayBars(root) {
        var cards = root.querySelectorAll("section.live-status article");
        if (!cards.length) return;
        if (!summary) return askSummary();

        var today = new Date();
        Array.prototype.forEach.call(cards, function (card) {
          if (card.getElementsByClassName("zol-days").length) return;
          var link = card.querySelector('a[href*="/history/"]');
          if (!link) return;
          var slug = link.getAttribute("href").split("/history/")[1];
          if (!slug) return;
          var site = null;
          summary.forEach(function (s) { if (s.slug === slug) site = s; });
          if (!site) return;

          var down = site.dailyMinutesDown || {};
          var bars = document.createElement("div");
          bars.className = "zol-days-bars";
          var outages = 0;
          var unknown = 0;
          for (var i = DAYS - 1; i >= 0; i--) {
            var at = new Date(today.getTime() - i * 86400000);
            var key = dayKey(at);
            var bar = document.createElement("i");
            var minutes = Math.round(down[key] || 0);
            if (key < WATCH_SINCE) {
              bar.title = dayLabel(key) + " — тогда мы ещё не следили";
              unknown++;
            } else if (minutes > 0) {
              bar.className = "zol-down";
              bar.title = dayLabel(key) + " — не работал " + minutesWord(minutes);
              outages++;
            } else {
              bar.className = "zol-up";
              bar.title = dayLabel(key) + " — работал без сбоев";
            }
            bars.appendChild(bar);
          }

          var legend = document.createElement("div");
          legend.className = "zol-days-legend";
          var left = document.createElement("span");
          /* Пока часть полосы серая, подпись слева объясняет именно серое: на
             телефоне подсказки по наведению нет, и без этой строки покупатель
             видит длинную серую полосу без единого слова о том, что она значит. */
          left.textContent = unknown
            ? "следим с " + dayLabel(WATCH_SINCE)
            : "30 дней назад";
          var right = document.createElement("span");
          right.textContent = "сегодня";
          legend.appendChild(left);
          legend.appendChild(right);

          var box = document.createElement("div");
          box.className = "zol-days";
          /* Цветом смысл не передаём: та же мысль есть словами в подписи под
             полосой и в подсказке у каждого дня. */
          box.setAttribute("role", "img");
          box.setAttribute(
            "aria-label",
            outages
              ? "Доступность по дням за 30 дней: дней со сбоями — " + outages
              : unknown
              ? "Доступность по дням: следим с " + dayLabel(WATCH_SINCE) + ", сбоев не было"
              : "Доступность по дням за 30 дней: сбоев не было"
          );
          box.appendChild(bars);
          box.appendChild(legend);
          card.appendChild(box);
        });
      }

      var queued = false;
      function pass() {
        queued = false;
        var root = document.getElementById("sapper") || document.body;
        if (!root) return;
        try { retime(root); } catch (e) {}
        try { paragraphs(root); } catch (e) {}
        try { dayBars(root); } catch (e) {}
      }
      function schedule() {
        if (queued) return;
        queued = true;
        window.setTimeout(pass, 0);
      }
      function start() {
        pass();
        try {
          new MutationObserver(schedule).observe(document.body, {
            childList: true, subtree: true, characterData: true
          });
        } catch (e) {}
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  navbar:
    - title: Доступность
      href: /
    - title: Сайт
      href: https://zolotenkov.ru/
    - title: Справка
      href: https://support.zolotenkov.ru/

i18n:
  locale: ru-RU
  activeIncidents: Идут аварии
  allSystemsOperational: Все сервисы работают
  incidentReport: "Авария №$NUMBER, подробности →"
  activeIncidentSummary: Началась $DATE, сообщений — $POSTS
  incidentTitle: Авария №$NUMBER, подробности
  incidentDetails: Что известно об аварии
  incidentFixed: Устранена
  incidentOngoing: Идёт сейчас
  incidentOpenedAt: Началась
  incidentClosedAt: Устранена
  incidentViewOnGitHub: Открыть и подписаться на обновления в GitHub
  incidentCommentSummary: $DATE, автор — $AUTHOR
  incidentBack: ← Ко всем авариям
  pastIncidents: Прошедшие аварии
  pastIncidentsResolved: Устранена за $MINUTES мин, сообщений — $POSTS
  liveStatus: Состояние сейчас
  overallUptime: "Доступность: $UPTIME"
  overallUptimeTitle: Доступность за всё время
  averageResponseTime: "Среднее время ответа: $TIME мс"
  averageResponseTimeTitle: Среднее время ответа
  sevelDayResponseTime: Время ответа в последние часы
  responseTimeMs: Время ответа, мс
  up: Работает
  down: Не работает
  degraded: Работает медленно
  ms: мс
  loading: Загружаем
  navGitHub: GitHub
  footer: Эта страница [открыта целиком]($REPO) и собрана на [Upptime](https://upptime.js.org). Проверки идут вне нашей инфраструктуры несколько раз в час, в отдельные часы реже.
  rateLimitExceededTitle: Слишком много запросов
  rateLimitExceededIntro: Вы исчерпали число запросов, которое можно сделать за час, и страница временно недоступна. Подождите час или добавьте личный токен GitHub.
  rateLimitExceededWhatDoesErrorMean: Что это значит?
